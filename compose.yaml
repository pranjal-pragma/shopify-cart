services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopify_cart_app
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: shopify
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

