client_id = __SHOPIFY_CLIENT_ID__
name = __SHOPIFY_APP_NAME__
application_url = __SHOPIFY_APP_URL__
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_publications,write_publications,write_discounts"
use_legacy_install_flow = false

[discount.metafields.app.function-configuration]
type = "json"
name = "Free gift configuration"
access.admin = "merchant_read_write"
access.storefront = "none"

[auth]
redirect_urls = []

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/v1/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/v1/shopify/webhooks"
